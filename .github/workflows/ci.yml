name: Commerce Suite CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build storefront
        run: npm run build
      - name: Run storefront tests
        run: npm run test:ci

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build admin dashboard
        run: npm run build
