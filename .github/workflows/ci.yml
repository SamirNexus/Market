name: Suite CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            apps/storefront/package-lock.json
            apps/admin/package-lock.json

      - name: Install storefront dependencies
        run: npm ci --prefix apps/storefront

      - name: Install admin dependencies
        run: npm ci --prefix apps/admin

      - name: Build storefront
        run: npm run build:storefront

      - name: Test storefront
        run: npm run test:storefront

      - name: Test admin
        run: npm run test:admin

      - name: Build admin
        run: npm run build:admin

  api-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://market:market@localhost:5432/market?schema=public
      CORS_ORIGINS: http://localhost:4200,http://localhost:4201
      PORT: 3000
      JWT_ACCESS_SECRET: ci-only-secret-change-before-deployment-123456789
      JWT_ACCESS_TTL_SECONDS: 900
      REFRESH_TOKEN_DAYS: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm ci --prefix apps/api --no-audit --no-fund

      - name: Generate Prisma client
        run: npm --prefix apps/api run prisma:generate

      - name: Validate Prisma schema
        run: npm --prefix apps/api run prisma:validate

      - name: Apply database migrations
        run: npm --prefix apps/api run prisma:migrate:deploy

      - name: Seed database
        run: npm --prefix apps/api run prisma:seed

      - name: Test API
        run: npm run test:api

      - name: Build API
        run: npm run build:api

  container-quality:
    runs-on: ubuntu-latest
    needs: [frontend-quality, api-quality]
    env:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      DATABASE_URL: postgresql://market:market@postgres:5432/market?schema=public
      PUBLIC_STOREFRONT_ORIGIN: https://shop.example.test
      PUBLIC_ADMIN_ORIGIN: https://admin.example.test
      JWT_ACCESS_SECRET: ci-container-secret-change-before-deployment-123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose model
        run: docker compose -f compose.production.yml config --quiet

      - name: Build API runtime image
        run: docker build --target runtime -f apps/api/Dockerfile -t market-api:ci .

      - name: Build API migration image
        run: docker build --target migration -f apps/api/Dockerfile -t market-migrate:ci .

      - name: Build storefront image
        run: docker build -f apps/storefront/Dockerfile -t market-storefront:ci .

      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t market-admin:ci .
