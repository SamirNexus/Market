name: Generate API lockfile

on:
  push:
    branches: [phase-2-backend-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-backend-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile
        run: npm install --prefix apps/api --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- apps/api/package-lock.json && git ls-files --error-unmatch apps/api/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json
          git commit -m "Lock API dependencies"
          git push origin HEAD:phase-2-backend-foundation
