<article class="product-card h-100">
  <a class="product-card__link" [routerLink]="['/details', data.id]" [attr.aria-label]="'View ' + data.title">
    <span class="product-card__category">{{ data.category }}</span>
    <img class="product-card__image" [src]="data.image" [alt]="data.title" loading="lazy">
    <div class="product-card__body">
      <h2>{{ data.title }}</h2>
      <p>{{ data.description }}</p>
      <div class="product-card__rating" aria-label="Product rating">
        <span>★ {{ data.rating.rate }}</span>
        <span>{{ data.rating.count }} reviews</span>
      </div>
    </div>
  </a>

  <div class="product-card__footer">
    <strong>{{ data.price | currency:'USD' }}</strong>
    <button class="btn btn-dark" *ngIf="!selectingQuantity" (click)="selectingQuantity = true">Add to cart</button>
    <div class="product-card__quantity" *ngIf="selectingQuantity">
      <input type="number" class="form-control" min="1" aria-label="Quantity" [(ngModel)]="amount">
      <button class="btn btn-dark" (click)="add()">Add</button>
    </div>
  </div>
</article>
