<div class="login-shell">
  <div class="login-card">
    <div class="mb-4">
      <p class="text-uppercase text-muted small mb-2">Market Commerce</p>
      <h1 class="h3 mb-2">Admin sign in</h1>
      <p class="text-muted mb-0">
        Use an authorized staff account to access store operations.
      </p>
    </div>

    <div class="alert alert-danger" role="alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="username"
          placeholder="name@company.com">
        <small
          class="text-danger"
          *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Password">
        <small
          class="text-danger"
          *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required.
        </small>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="form.invalid || submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
